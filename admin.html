<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Great Kawuor Welfare Group – Administration</title>
<link rel="manifest" href="manifest-admin.json"><meta name="theme-color" content="#14452b"><link rel="icon" href="icon-admin-192.png"><link rel="apple-touch-icon" href="apple-touch-icon-admin.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kawuor Admin">
<style>
:root{--bg:#f4f8f5;--surface:#fff;--ink:#12281d;--muted:#4a5d52;--brand:#1b5e3a;--brand-ink:#fff;--accent:#d4a017;--line:#d5e2d9;--ok:#1d7a4d;--warn:#a96a00;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1f16;--surface:#162b1f;--ink:#e9f2ec;--muted:#a3b8aa;--brand:#5fbf86;--brand-ink:#06190f;--line:#2a4535;--ok:#6fd39b;--warn:#d4a017;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
header{border-bottom:1px solid var(--line)}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.8rem 1rem}
h2{margin:0 0 .8rem;font-size:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1.1rem;margin:1rem 0}
label{display:block;font-weight:600;margin:.7rem 0 .2rem}
input,select,textarea{width:100%;padding:.6rem;border:1px solid var(--line);border-radius:.5rem;background:var(--bg);color:var(--ink);font:inherit}
button,a.btn{font:inherit;font-weight:700;padding:.55rem 1rem;border-radius:.5rem;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,a.btn.ghost{background:transparent;color:var(--ink)}
button.sm{padding:.25rem .6rem;font-size:.85rem}button.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
form button[type=submit]{margin-top:1rem}
#msg{padding:.8rem 1rem;border-radius:.5rem;margin:1rem 0;font-weight:600;border:1px solid var(--line);background:var(--surface)}
#msg.bad{color:var(--bad);border-color:var(--bad)}#msg.ok{color:var(--ok);border-color:var(--ok)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1rem}.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}
.tabs button[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.stats{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
.stat{border-left:4px solid var(--accent);padding-left:.7rem}.stat.link{cursor:pointer}.stat.link:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}a{color:var(--brand)}.stat small{display:block;color:var(--muted)}.stat b{font-size:1.3rem}
.grid2{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr))}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:.5rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tag{padding:.1rem .5rem;border-radius:1rem;border:1px solid var(--line);font-size:.85rem}
.t-active,.t-approved{color:var(--ok);border-color:var(--ok)}.t-pending,.t-approaching{color:var(--warn);border-color:var(--warn)}.t-deregistered,.t-rejected,.t-reversed,.t-defaulted{color:var(--bad);border-color:var(--bad)}
.t-open,.t-published{color:var(--ok);border-color:var(--ok)}.t-closed,.t-draft,.t-expired{color:var(--muted)}@media print{header,.tabs,#msg,.noprint,button,#f-prof{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0}}
.muted{color:var(--muted)}header{background:#14452b;color:#fff;border-bottom:4px solid var(--accent)}
header b{color:#fff}.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:#fff;line-height:1.15}.brand svg{width:2.6rem;height:2.6rem;flex:none}.brand small{display:block;font-weight:400;font-size:.78rem;color:#e6c96d}
header button.ghost,header a.btn.ghost{color:#fff;border-color:#fff}
h2{color:var(--brand)}.card{box-shadow:0 1px 3px rgba(20,60,35,.1)}
th{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.tabs button[aria-selected=true]{border-bottom:3px solid var(--accent)}
button:hover,a.btn:hover{filter:brightness(1.12)}
#auth,#f-login{max-width:30rem;margin:2rem auto}
.logo-img{height:3.4rem;width:auto;background:#fff;border-radius:.6rem;padding:.2rem .5rem;flex:none}
dialog{border:1px solid var(--line);border-radius:1rem;background:var(--surface);color:var(--ink);max-width:28rem;width:92%}dialog::backdrop{background:rgba(0,0,0,.45)}
.pw{position:relative}.pw input{padding-right:3rem}.pw .eye{position:absolute;right:.3rem;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);padding:0;width:2.5rem;height:2.5rem;display:flex;align-items:center;justify-content:center;cursor:pointer;filter:none}.pw .eye:hover{color:var(--ink)}
.ani{width:2.4rem;height:auto;vertical-align:middle}.ani.photo{width:2.4rem;height:2.4rem;object-fit:cover;border-radius:50%}.lv{white-space:nowrap}
[hidden]{display:none!important}
</style>
</head>

    <button role="tab" data-tab="doc" aria-selected="false">Documents</button>

  <div id="p-dash"></div><div id="p-members" hidden></div><div id="p-pay" hidden></div><div id="p-watch" hidden></div><div id="p-cases" hidden></div><div id="p-exp" hidden></div><div id="p-oi" hidden></div><div id="p-ann" hidden></div><div id="p-of" hidden></div><div id="p-rep" hidden></div><div id="p-prof" hidden></div><div id="p-set" hidden></div><div id="p-doc" hidden></div><div id="p-aud" hidden></div>
</section>
</main>
<dialog id="pd"><form id="pd-f"><h2 id="pd-t"></h2><p id="pd-i" class="muted"></p>
  <label for="pd-a">Total amount received (KSh)</label><input id="pd-a" type="number" min="1" step="1" required>
  <label for="pd-m">Method</label><select id="pd-m"><option>M-Pesa</option><option>Bank</option><option>Cash</option></select>
  <div id="pd-fw"><label for="pd-p">Payment message</label><textarea id="pd-p" rows="3" placeholder="Paste the whole message here"></textarea><p id="pd-r" class="muted"></p></div>

  <p><button type="submit">Continue</button> <button type="button" id="pd-x" class="ghost">Cancel</button></p></form></dialog>
<dialog id="gd" style="max-width:46rem"><h2>Edit shared payment</h2><p class="muted">Change who gets what. The lines must add up to the amount in the payment message.</p><div id="gl"></div><p><button type="button" class="sm ghost" id="gd-add">Add another line</button></p><p id="gd-t"></p><p id="gd-e" style="color:var(--bad);font-weight:600"></p><p><button type="button" id="gd-s">Save changes</button> <button type="button" class="ghost" id="gd-x">Cancel</button></p></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'KSh '+Number(n||0).toLocaleString('en-KE');
const fdate=d=>d?new Date(d.slice(0,10)+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const today=()=>new Date().toISOString().slice(0,10);
const KIND={monthly:'Monthly',registration:'Registration',special:'Special',reregistration:'Re-registration'};
const db=supabase.createClient(KAWUOR_CONFIG.url,KAWUOR_CONFIG.anonKey,{auth:{storageKey:'kawuor-admin-session'}});
let uid=null,members=[],started=false,editPay=null;

function say(t,bad){const m=$('msg');m.textContent=t||'';m.className=t?(bad?'bad':'ok'):'';m.hidden=!t}
function friendly(e){if(e&&e.code==='23503')return 'This case has contributions recorded, so it cannot be deleted. Close it instead.';if(e&&e.code==='23505')return 'That payment message or transaction code has already been recorded.';return (e&&e.message)||'Something went wrong. Please try again.'}
async function run(fn){try{say('');await fn()}catch(e){say(friendly(e),true)}}
async function rpc(name,args){const{data,error}=await db.rpc(name,args);if(error)throw error;return data}
function tag(s){const L={reversed:'deleted'};return `<span class="tag t-${esc(s)}">${esc(L[s]||s)}</span>`}

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));
  for(const t of ['dash','members','pay','watch','cases','exp','ann','rep','prof','set','doc','aud','oi','of'])$('p-'+t).hidden=t!==b.dataset.tab});
$('f-login').onsubmit=e=>{e.preventDefault();run(async()=>{const{error}=await db.auth.signInWithPassword({email:$('l-email').value.trim(),password:$('l-pass').value});if(error)throw error})};
$('logout').onclick=()=>db.auth.signOut();
db.auth.onAuthStateChange((ev,s)=>{
  if(s&&s.user){if(s.user.id!==uid){uid=s.user.id;setTimeout(start,0)}}
  else{uid=null;started=false;$('app').hidden=true;$('logout').hidden=true;$('f-login').hidden=false}});

async function start(){await run(async()=>{
  const r=await db.from('user_roles').select('role').eq('user_id',uid).maybeSingle();
  if(r.error)throw r.error;
  if(!r.data||r.data.role!=='admin'){$('f-login').hidden=true;$('app').hidden=true;$('logout').hidden=false;say('This page is for administrators only. Your account is not an administrator.',true);return}
  $('f-login').hidden=true;$('app').hidden=false;$('logout').hidden=false;started=true;
  await refresh()})}
async function refresh(){await membersTab();await Promise.all([dash(),payTab(),watch(),casesTab(),expTab(),annTab(),repTab(),setTab(),docTab(),audTab(),oiTab(),ofTab()])}

async function dash(){
  const d=await rpc('admin_dashboard');
  const S=(l,v,g)=>`<div class="stat${g?' link':''}"${g?` data-g="${g}" role="button" tabindex="0"`:''}><small>${l}${g?' ›':''}</small><b>${v}</b></div>`;
  $('p-dash').innerHTML=`<div class="card"><h2>Members</h2><div class="stats">${S('Registered people',d.members_total,'m:')}${S('Active memberships',d.active,'m:active')}${S('Deregistered',d.deregistered,'m:deregistered')}${S('Re-registered (active)',d.re_registered,'m:re')}</div></div>
  <div class="card"><h2>Money</h2><div class="stats">${S('Monthly contributions',money(d.monthly_total),'r:income')}${S('Registration fees',money(d.registration_total),'r:registration')}${S('Special contributions',money(d.special_total),'r:special')}${S('Other income',money(d.other_income_total),'t:oi')}${S('Outstanding',money(d.outstanding),'r:arrears')}${S('Paid in advance',money(d.advance),'r:advance')}${S('Total expenses',money(d.expenses_total),'r:expenses')}</div></div>
  <div class="card"><h2>Cases and approvals</h2><div class="stats">${S('Open welfare cases',d.cases_open,'c:open')}${S('Closed welfare cases',d.cases_closed,'c:closed')}${S('Payments waiting for approval',d.pending_payments,'p:')}</div></div>
  <div class="card"><h2>Recent transactions</h2><div class="scroll"><table><thead><tr><th>Date</th><th>From</th><th>For</th><th>Amount</th><th>Code</th><th>Status</th></tr></thead><tbody>
  ${d.recent_payments.map(p=>`<tr><td>${fdate(p.paid_on)}</td><td>${esc(p.who)}</td><td>${KIND[p.kind]||p.kind}${p.period_year?' '+p.period_year:''}</td><td>${money(p.amount)}</td><td>${esc(p.reference)}</td><td>${tag(p.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No transactions yet.</td></tr>'}</tbody></table></div></div>`;
  document.querySelectorAll('[data-g]').forEach(b=>{const go=()=>jump(b.dataset.g);b.onclick=go;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}

async function membersTab(){
  const{data,error}=await db.from('v_admin_members').select('*').order('full_name');if(error)throw error;members=data;
  $('p-members').innerHTML=`<div class="card"><h2>Add a member</h2><p class="muted">For members without a phone or computer. They get no online login. You register them and record their payments for them, and you can print their statement.</p>
   <form id="f-add"><div class="grid2"><div><label for="am-n">Full names as per National ID</label><input id="am-n" required></div><div><label for="am-p">Phone number</label><input id="am-p" type="tel" required></div><div><label for="am-i">National ID number</label><input id="am-i" required></div>
   <div><label for="am-e">Email (optional)</label><input id="am-e" type="email"></div><div><label for="am-d">Joining date (optional)</label><input id="am-d" type="date"></div></div>
   <p class="muted">Enter the joining date to register them straight away with a KA number. Leave it empty to register them later with the Register button.</p><button type="submit">Add member</button></form></div>
   <div class="card"><h2>Members</h2><div class="grid2">
   <div><label for="q">Search name, phone or number</label><input id="q"></div>
   <div><label for="sf">Show</label><select id="sf"><option value="">Everyone</option><option value="active">Active</option><option value="deregistered">Deregistered</option><option value="re">Re-registered</option><option value="none">Awaiting membership</option><option value="arrears">In arrears</option><option value="advance">Paid in advance</option><option value="lv-active">Active (no arrears)</option><option value="lv-partial">Partially active (in arrears)</option><option value="lv-passive">Passive (past 6 months)</option></select></div></div>
   <div class="scroll" style="margin-top:1rem"><table><thead><tr><th>Name</th><th>Phone</th><th>Number</th><th>Status</th><th>Joined</th><th>Outstanding</th><th>Advance</th><th></th></tr></thead><tbody id="mrows"></tbody></table></div></div>`;
  $('q').oninput=$('sf').onchange=drawMembers;drawMembers();
  $('f-add').onsubmit=e=>{e.preventDefault();run(async()=>{await rpc('admin_add_member',{p_full_name:$('am-n').value,p_phone:$('am-p').value,p_email:$('am-e').value,p_joined_on:$('am-d').value||null,p_national_id:$('am-i').value});say($('am-d').value?'Member added and registered.':'Member added. Use Register to give them a membership number.');await refresh()})}}
function drawMembers(){
  const q=$('q').value.toLowerCase(),f=$('sf').value;
  $('mrows').innerHTML=members.filter(m=>{
    if(q&&!`${m.full_name} ${m.phone||''} ${m.number||''} ${m.national_id||''}`.toLowerCase().includes(q))return false;
    if(f.startsWith('lv-'))return !!m.membership_id&&lvOf(m.status,m.outstanding)===f.slice(3);if(f==='re')return m.category==='re_registered'&&m.status==='active';if(f==='active')return m.status==='active';if(f==='deregistered')return m.status==='deregistered';
    if(f==='none')return !m.membership_id;if(f==='arrears')return Number(m.outstanding)>0;if(f==='advance')return Number(m.advance_paid)>0;return true})
   .map(m=>`<tr><td><a href="#" data-prof="${esc(m.member_id)}">${esc(m.full_name)}</a><br><span class="muted">${esc(realEmail(m.email))}${m.has_login===false?' · no online login':''}<br>${m.national_id?'ID '+esc(m.national_id):'ID not added'}</span></td><td>${esc(m.phone)}</td><td>${esc(m.number||'')}</td><td>${m.membership_id?lvBadge(m.status,m.outstanding)+(m.status&&m.status!=='active'?' '+tag(m.status):''):'<span class="muted">Awaiting</span>'}</td><td>${fdate(m.joined_on)}</td><td>${m.membership_id?money(m.outstanding):''}</td><td>${m.membership_id?money(m.advance_paid):''}</td>
   <td>${m.status==='active'?`<button class="sm danger" data-dereg="${esc(m.membership_id)}" data-n="${esc(m.full_name)}">Deregister</button>`:(m.status==='deregistered'&&m.reinstate_until&&m.reinstate_until>=today())?`<button class="sm" data-rein="${esc(m.membership_id)}" data-n="${esc(m.full_name)}">Reinstate</button><br><span class="muted">until ${fdate(m.reinstate_until)}</span>`:`<button class="sm" data-reg="${esc(m.member_id)}" data-re="${m.membership_id?1:''}" data-n="${esc(m.full_name)}">${m.membership_id?'Re-register':'Register'}</button>`}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No members match.</td></tr>';
  document.querySelectorAll('[data-reg]').forEach(b=>b.onclick=()=>run(async()=>{
    const d=prompt(`Joining date for ${b.dataset.n} (YYYY-MM-DD). It can be a past date.`,today());if(!d)return;
    if(b.dataset.re){
      const[st,rt]=await Promise.all([db.from('org_settings').select('key,value').in('key',['reregistration_fee','reregistration_upfront_months']),db.from('contribution_rates').select('amount').eq('rate_type','monthly').lte('effective_from',d).order('effective_from',{ascending:false}).limit(1)]);
      const o=Object.fromEntries((st.data||[]).map(x=>[x.key,+x.value])),need=(o.reregistration_fee||0)+(o.reregistration_upfront_months||0)*Number(rt.data?.[0]?.amount||0);
      const dlg=await payDialog('Re-register '+b.dataset.n,`Fee ${money(o.reregistration_fee)} plus ${o.reregistration_upfront_months} months paid upfront: exactly ${money(need)}.`,need);if(!dlg)return;
      if(dlg.amount!==need)throw new Error(`Re-registration must be exactly ${money(need)}.`);
      await rpc('record_payment',{p_member_id:b.dataset.reg,p_kind:'reregistration',p_amount:need,p_paid_on:d,p_method:dlg.method,p_reference:dlg.reference,p_message_text:dlg.message});
      const nn=await db.from('memberships').select('number').eq('member_id',b.dataset.reg).order('created_at',{ascending:false}).limit(1);const rr={number:(nn.data&&nn.data[0]&&nn.data[0].number)||'a new KARE number'};
      say(`${b.dataset.n} re-registered as ${rr.number}. The fee and upfront months are recorded.`);await refresh();return}
    const r=await rpc('register_membership',{p_member_id:b.dataset.reg,p_joined_on:d});say(`${b.dataset.n} registered as ${r.number}.`);await refresh()}));
  document.querySelectorAll('[data-dereg]').forEach(b=>b.onclick=()=>run(async()=>{
    const why=prompt(`Reason for deregistering ${b.dataset.n}:`);if(!why)return;
    await rpc('deregister_membership',{p_membership_id:b.dataset.dereg,p_reason:why,p_date:today()});say('Membership deregistered.');await refresh()}));
  document.querySelectorAll('[data-rein]').forEach(b=>b.onclick=()=>run(async()=>{
    const q=await rpc('reinstatement_quote',{p_membership_id:b.dataset.rein});
    const dlg=await payDialog('Reinstate '+b.dataset.n,`To keep the old membership, everything owed up to now must be paid: ${money(q)}.`,q);if(!dlg)return;
    const r=await rpc('reinstate_membership',{p_membership_id:b.dataset.rein,p_amount_received:dlg.amount,p_method:dlg.method,p_reference:dlg.reference,p_message_text:dlg.message,p_paid_on:today()});
    say(`${b.dataset.n} reinstated on ${r.number}.`);await refresh()}));
  document.querySelectorAll('[data-prof]').forEach(a=>a.onclick=e=>{e.preventDefault();run(()=>profile(a.dataset.prof))})}

async function payTab(){
  const{data,error}=await db.from('v_admin_payments').select('*').order('created_at',{ascending:false}).limit(300);if(error)throw error;
  const pend=data.filter(p=>p.status==='pending'&&!p.split_group);
  const cn={},pg=new Map();data.filter(p=>p.status==='pending'&&p.split_group).forEach(p=>{if(!pg.has(p.split_group))pg.set(p.split_group,[]);pg.get(p.split_group).push(p)});const cs=(await db.from('v_case_progress').select('id,title,beneficiary_name').eq('status','open')).data||[];
  const[st2,rt2]=await Promise.all([db.from('org_settings').select('key,value').in('key',['reregistration_fee','reregistration_upfront_months']),db.from('contribution_rates').select('amount').eq('rate_type','monthly').order('effective_from',{ascending:false}).limit(1)]);
  const so=Object.fromEntries((st2.data||[]).map(x=>[x.key,+x.value])),reregAmt=(so.reregistration_fee||0)+(so.reregistration_upfront_months||0)*Number(rt2.data?.[0]?.amount||0);
  const row=(p,acts)=>`<tr><td>${fdate(p.paid_on)}</td><td>${esc(p.who)}</td><td>${esc(p.number||'')}</td><td>${KIND[p.kind]||p.kind}${p.period_year?' '+p.period_year:''}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.reference)}${p.split_group?' <span class="tag">shared</span>':''}${p.message_text?` <button class="sm ghost" data-pm="${esc(p.message_text)}">View message</button>`:''}${p.proof_path?` <button class="sm ghost" data-pf="${esc(p.proof_path)}">View message</button>`:''}</td><td>${tag(p.status)}${p.review_note?`<br><span class="muted">${esc(p.review_note)}</span>`:''}</td><td>${acts}</td></tr>`;
  const head='<thead><tr><th>Date</th><th>From</th><th>No.</th><th>For</th><th>Amount</th><th>Method</th><th>Code</th><th>Status</th><th></th></tr></thead>';
  $('p-pay').innerHTML=`${editPay?`<div class="card" id="fixcard"><h2>Correct a payment</h2><p class="muted">${esc(editPay.who)} · ${KIND[editPay.kind]} · ${editPay.status==='approved'?'This payment is approved. Correcting it reverses the old record and enters a new approved one. Both stay in the history.':'This payment is still waiting for approval, so it is changed in place.'}</p><form id="f-fix"><div class="grid2"><div><label for="xa">Amount (KSh)</label><input id="xa" type="number" min="1" step="1" value="${esc(editPay.amount)}" required></div><div><label for="xd">Date paid</label><input id="xd" type="date" value="${esc(editPay.paid_on)}" required></div><div><label for="xm">Method</label><select id="xm">${['M-Pesa','Bank','Cash'].map(m=>`<option${(editPay.method||'').toLowerCase().replace('-','')===m.toLowerCase().replace('-','')?' selected':''}>${m}</option>`).join('')}</select></div><div id="xrw"><label for="xr">Transaction code</label><input id="xr" value="${esc(editPay.reference)}"></div><div id="xpw" style="grid-column:1/-1"><label for="xp">Payment message ${editPay.message_text||editPay.proof_path?'(leave it, or paste a replacement)':'(paste it)'}</label><textarea id="xp" rows="3">${esc(editPay.message_text)}</textarea></div>${editPay.kind==='monthly'?`<div><label for="xy">Contribution year</label><input id="xy" type="number" min="2000" max="2100" value="${esc(editPay.period_year||'')}"></div>`:''}</div><label for="xn">Reason for correction</label><input id="xn" required><button type="submit">Save correction</button> <button type="button" id="xc" class="ghost">Cancel</button></form></div>`:''}<div class="card"><h2>Record a payment</h2><p class="muted">Use this for a payment you have already checked. It is approved and allocated straight away.</p>
   <form id="f-rec"><div class="grid2"><div><label for="rm">From</label><select id="rm"><option value="">Non-member (voluntary)</option>${members.map(m=>`<option value="${esc(m.member_id)}">${esc(m.full_name)}${m.number?' ('+esc(m.number)+')':''}</option>`).join('')}</select></div>
   <div id="nmw"><label for="nm">Non-member name</label><input id="nm"></div>
   <div><label for="rk">For</label><select id="rk"><option value="monthly">Monthly contribution</option><option value="registration">Registration fee</option><option value="special">Special / welfare contribution</option><option value="reregistration">Re-registration (fixed amount)</option></select></div><div id="ryw"><label for="ry2">Contribution year (any year)</label><input id="ry2" type="number" min="2000" max="2100" step="1" value="${new Date().getFullYear()}"></div>
   <div><label for="ra">Amount (KSh)</label><input id="ra" type="number" min="1" step="1" required></div>
   <div><label for="rd">Date paid</label><input id="rd" type="date" value="${today()}" required></div>
   <div><label for="rmth">Method</label><select id="rmth"><option>M-Pesa</option><option>Bank</option><option>Cash</option></select></div>
   <div id="rpw" style="grid-column:1/-1"><label for="rp">Payment message</label><textarea id="rp" rows="3" placeholder="Paste the whole M-Pesa or bank message here"></textarea><span id="rp-r" class="muted"></span></div><div id="rrw" hidden><label for="rr">Transaction code (only if it could not be read)</label><input id="rr"></div><div id="rcw" hidden><label for="rc">Welfare case (optional)</label><select id="rc"><option value="">General contribution</option>${cs.map(c=>`<option value="${esc(c.id)}">${esc(c.title)} (${esc(c.beneficiary_name)})</option>`).join('')}</select></div></div><button type="submit">Record payment</button></form></div>
   <div class="card"><h2>Shared payment (one payment, several members)</h2>
   <p class="muted">For example, a son pays for himself and his mother in one M-Pesa payment. Paste the message once, then say how much goes to each person and for what. Each person's account shows only their own share. Everyone must already be registered and active.</p>
   <form id="f-sh"><div class="grid2"><div><label for="sh-m">Method</label><select id="sh-m"><option>M-Pesa</option><option>Bank</option><option>Cash</option></select></div><div><label for="sh-d">Date paid</label><input id="sh-d" type="date" value="${today()}" required></div></div>
   <div id="sh-mw"><label for="sh-p">Payment message</label><textarea id="sh-p" rows="3" placeholder="Paste the whole M-Pesa or bank message here"></textarea><span id="sh-r" class="muted"></span></div>
   <div id="sh-cw" hidden><label for="sh-c">Transaction code (only if it could not be read)</label><input id="sh-c"></div>
   <div id="sl"></div><p><button type="button" class="sm ghost" id="sh-add">Add another line</button></p><p id="sh-t"></p><button type="submit">Record shared payment</button></form></div>
  <div class="card"><h2>Shared payments waiting for approval (${pg.size})</h2>${[...pg.values()].map(rows=>{const first=rows.find(r=>r.message_text)||rows[0],tot=rows.reduce((a,r)=>a+Number(r.amount),0),g=first.split_group;
   return `<div style="border-top:1px solid var(--line);padding:.7rem 0"><b>${money(tot)}</b> · ${esc(first.method)} · ${fdate(first.paid_on)}${first.reference?' · '+esc(first.reference):''}${first.submitted_by?' · submitted by '+esc(first.submitted_by):''}
   <div class="scroll"><table><tbody>${rows.map(r=>`<tr><td>${esc(r.who)}</td><td>${esc(r.number||'')}</td><td>${KIND[r.kind]||r.kind}${r.period_year?' '+r.period_year:''}${r.case_id?' · welfare case':''}</td><td>${money(r.amount)}</td></tr>`).join('')}</tbody></table></div>
   <p>${first.message_text?`<button class="sm ghost" data-pm="${esc(first.message_text)}">View message</button> `:''}<button class="sm ghost" data-ge="${g}">Edit lines</button> <button class="sm" data-ga="${g}">Approve all</button> <button class="sm danger" data-gr="${g}">Reject all</button></p></div>`}).join('')||'<p class="muted">Nothing waiting.</p>'}</div>

async function fetchAll(make){let out=[],from=0;for(;;){const{data,error}=await make().range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
const sum=(rows,i)=>rows.reduce((a,r)=>a+Number(r[i]||0),0);
const grp=(rows,fn)=>{const m=new Map();rows.forEach(r=>{if(!m.has(r.membership_id))m.set(r.membership_id,{number:r.number,name:r.full_name,months:0,a:0,b:0,c:0,d:0});fn(m.get(r.membership_id),r)});return[...m.values()].sort((x,y)=>String(x.number).localeCompare(String(y.number)))};
const monthsQ=(f,fromP,toP)=>()=>{let b=db.from('v_report_months').select('*').order('period').order('membership_id');if(fromP)b=b.gte('period',fromP);if(toP)b=b.lte('period',toP);if(f.member)b=b.eq('member_id',f.member);return b};
const payQ=(f,kind)=>()=>{let b=db.from('v_admin_payments').select('*').eq('kind',kind).eq('status','approved').gte('paid_on',f.from).lte('paid_on',f.to).order('paid_on').order('id');if(f.member)b=b.eq('member_id',f.member);return b};
const range=f=>fdate(f.from)+' to '+fdate(f.to);
const REP={
 register:{t:'Membership register',u:'Member (optional)',run:async f=>{
  const d=(await fetchAll(()=>db.from('v_admin_members').select('*').order('full_name').order('member_id'))).filter(r=>!f.member||r.member_id===f.member);
  const rows=d.map(r=>[r.number||'',r.full_name,r.national_id||'',r.phone,r.email,r.status||'awaiting',r.category||'',r.joined_on,r.outstanding||0,r.advance_paid||0]);
  return{cols:[['Number'],['Name'],['National ID'],['Phone'],['Email'],['Status'],['Category'],['Joined','d'],['Outstanding','m'],['Advance','m']],rows,totals:[rows.length+' people',null,null,null,null,null,null,null,sum(rows,8),sum(rows,9)],desc:'All members'}}},
 monthly:{t:'Monthly contributions',u:'Year, month, member (optional)',run:async f=>{
  const d=await fetchAll(monthsQ(f,f.month?`${f.year}-${f.month}-01`:f.year+'-01-01',f.month?`${f.year}-${f.month}-01`:f.year+'-12-01'));
  const rows=d.map(r=>[r.number,r.full_name,r.period,r.due_amount,r.paid,Math.max(r.due_amount-r.paid,0),r.status]);
  return{cols:[['Number'],['Name'],['Month','mo'],['Due','m'],['Paid','m'],['Balance','m'],['Status']],rows,totals:['Total',null,null,sum(rows,3),sum(rows,4),sum(rows,5),null],desc:'Year '+f.year+(f.month?', '+MON[+f.month-1]:'')}}},
 annual:{t:'Annual contributions',u:'Year, member (optional)',run:async f=>{
  const d=await fetchAll(monthsQ(f,f.year+'-01-01',f.year+'-12-01'));

function parseMsg(t){
  const s=String(t||'');let code=null,m=s.match(/\b([A-Z][A-Z0-9]{9})\b(?=[\s.,:-]*Confirmed)/);
  if(m)code=m[1];
  if(!code){m=s.match(/\b(?=[A-Z0-9]*\d)(?=[A-Z0-9]*[A-Z])([A-Z0-9]{10})\b/);if(m)code=m[1]}
  if(!code){m=s.match(/(?:ref(?:erence)?|transaction|txn|trx|receipt)[\s\w.]{0,12}?[:#=\-]\s*([A-Za-z0-9][A-Za-z0-9\-]{5,24})/i);if(m)code=m[1].toUpperCase()}
  let amount=null;m=s.match(/(?:ksh?s?|kes)\.?\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)/i);
  if(m)amount=Number(m[1].replace(/,/g,''));
  return{code,amount}}

    const row={source_type:$('oi-t').value,received_on:$('oi-d').value,source_name:$('oi-n').value.trim()||null,amount:+$('oi-a').value,method:$('oi-m').value,reference:$('oi-r').value.trim()||null,notes:$('oi-x').value.trim()||null};
    if(x.id)row.updated_at=new Date().toISOString();
    const w=x.id?await db.from('other_income').update(row).eq('id',x.id):await db.from('other_income').insert(row);if(w.error)throw w.error;
    say(x.id?'Income updated.':'Income added to the records.');editOI=null;await refresh()})};
  if($('oi-c'))$('oi-c').onclick=()=>{editOI=null;oiTab()};
  document.querySelectorAll('[data-oe]').forEach(b=>b.onclick=()=>{editOI=data.find(r=>r.id===b.dataset.oe);oiTab().then(()=>scrollTo(0,0))});
  document.querySelectorAll('[data-ox]').forEach(b=>b.onclick=()=>run(async()=>{const why=prompt('Reason for deleting this income record:');if(!why)return;await rpc('admin_delete_other_income',{p_id:b.dataset.ox,p_reason:why});say('Income record deleted.');await refresh()}))}

const LVN={active:'Active',partial:'Partially active',passive:'Passive'},LVA={active:'Cheetah',partial:'Elephant',passive:'Tortoise'};
const lvOf=(st,out)=>st!=='active'?'passive':(Number(out)>0?'partial':'active');
const lvBadge=(st,out)=>{const l=lvOf(st,out);return `<span class="lv"><img class="ani photo" data-lv="${l}" src="animal-${l}.jpg" alt="${LVA[l]}" title="${LVA[l]}" onerror="this.onerror=null;this.classList.remove('photo');this.src=ANIMALS['${l}']"> ${LVN[l]}</span>`};
const realEmail=e=>e&&!String(e).endsWith('.invalid')?e:'';
async function ofTab(){
  const{data,error}=await db.from('officials').select('*').order('slot');if(error)throw error;
  $('p-of').innerHTML=`<div class="card"><h2>Officials of the group</h2><p class="muted">Fill in each position you want members to see: the full names and the phone number. Members see only the positions that are filled in, in this order. Elected officials serve two years, renewable once, unless two-thirds of members resolve otherwise. Leave the name empty to hide a position. Place 10 is a spare: type its title.</p>
   <form id="f-of">${data.map(o=>`<div style="border-top:1px solid var(--line);padding:.8rem 0"><div class="grid2">
   <div><label for="of-p${o.slot}">Position ${o.slot}</label><input id="of-p${o.slot}" value="${esc(o.position)}"${o.slot===10?'':' readonly'}></div>
   <div><label for="of-n${o.slot}">Full names</label><input id="of-n${o.slot}" value="${esc(o.full_name)}"></div>
   <div><label for="of-t${o.slot}">Phone number</label><input id="of-t${o.slot}" type="tel" value="${esc(o.phone)}"></div>
   <div><label for="of-s${o.slot}">Term starts</label><input id="of-s${o.slot}" type="date" value="${esc(o.term_start)}"></div>
   <div><label for="of-e${o.slot}">Term ends</label><input id="of-e${o.slot}" type="date" value="${esc(o.term_end)}"></div>
   <div><label for="of-m${o.slot}">Term</label><select id="of-m${o.slot}"><option value="1">First term</option><option value="2">Second term (last)</option></select></div></div></div>`).join('')}
   <button type="submit">Save officials</button></form></div>`;
  data.forEach(o=>{$('of-m'+o.slot).value=String(o.term_no||1);
    $('of-s'+o.slot).onchange=()=>{const v=$('of-s'+o.slot).value;if(v&&!$('of-e'+o.slot).value){const d=new Date(v+'T00:00:00');d.setFullYear(d.getFullYear()+2);d.setDate(d.getDate()-1);$('of-e'+o.slot).value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}}});
  $('f-of').onsubmit=e=>{e.preventDefault();run(async()=>{
    for(const o of data){const pos=$('of-p'+o.slot).value.trim(),n=$('of-n'+o.slot).value.trim(),t=$('of-t'+o.slot).value.trim(),s=$('of-s'+o.slot).value,en=$('of-e'+o.slot).value;
      if(n&&t.replace(/\D/g,'').length<9)throw new Error(`Enter a valid phone number for ${pos}.`);
      if(!n&&t)throw new Error(`Enter the full names for ${pos}, or clear the phone number.`);
      if(s&&en&&en<=s)throw new Error(`The term end must be after the term start for ${pos}.`)}
    for(const o of data){const w=await db.from('officials').update({position:$('of-p'+o.slot).value.trim()||o.position,full_name:$('of-n'+o.slot).value.trim()||null,phone:$('of-t'+o.slot).value.trim()||null,term_start:$('of-s'+o.slot).value||null,term_end:$('of-e'+o.slot).value||null,term_no:+$('of-m'+o.slot).value,updated_at:new Date().toISOString()}).eq('slot',o.slot);if(w.error)throw w.error}
    say('Officials saved. Members with an active membership can now see them.');await ofTab()})}}

if(!KAWUOR_CONFIG.url||KAWUOR_CONFIG.url.includes('YOUR-PROJECT'))say('Setup needed: add your Supabase URL and key to config.js.',true);
