<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Great Kawuor Welfare Group – Administration</title>
<style>
:root{--bg:#f4f8f5;--surface:#fff;--ink:#12281d;--muted:#4a5d52;--brand:#1b5e3a;--brand-ink:#fff;--accent:#d4a017;--line:#d5e2d9;--ok:#1d7a4d;--warn:#a96a00;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1f16;--surface:#162b1f;--ink:#e9f2ec;--muted:#a3b8aa;--brand:#5fbf86;--brand-ink:#06190f;--line:#2a4535;--ok:#6fd39b;--warn:#d4a017;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
header{border-bottom:1px solid var(--line)}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.8rem 1rem}
h2{margin:0 0 .8rem;font-size:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1.1rem;margin:1rem 0}
label{display:block;font-weight:600;margin:.7rem 0 .2rem}
input,select,textarea{width:100%;padding:.6rem;border:1px solid var(--line);border-radius:.5rem;background:var(--bg);color:var(--ink);font:inherit}
button,a.btn{font:inherit;font-weight:700;padding:.55rem 1rem;border-radius:.5rem;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,a.btn.ghost{background:transparent;color:var(--ink)}
button.sm{padding:.25rem .6rem;font-size:.85rem}button.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
form button[type=submit]{margin-top:1rem}
#msg{padding:.8rem 1rem;border-radius:.5rem;margin:1rem 0;font-weight:600;border:1px solid var(--line);background:var(--surface)}
#msg.bad{color:var(--bad);border-color:var(--bad)}#msg.ok{color:var(--ok);border-color:var(--ok)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1rem}.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}
.tabs button[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.stats{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
.stat{border-left:4px solid var(--accent);padding-left:.7rem}.stat.link{cursor:pointer}.stat.link:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}a{color:var(--brand)}.stat small{display:block;color:var(--muted)}.stat b{font-size:1.3rem}
.grid2{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr))}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:.5rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tag{padding:.1rem .5rem;border-radius:1rem;border:1px solid var(--line);font-size:.85rem}
.t-active,.t-approved{color:var(--ok);border-color:var(--ok)}.t-pending,.t-approaching{color:var(--warn);border-color:var(--warn)}.t-deregistered,.t-rejected,.t-reversed,.t-defaulted{color:var(--bad);border-color:var(--bad)}
.t-open,.t-published{color:var(--ok);border-color:var(--ok)}.t-closed,.t-draft,.t-expired{color:var(--muted)}@media print{header,.tabs,#msg,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0}}
.muted{color:var(--muted)}header{background:#14452b;color:#fff;border-bottom:4px solid var(--accent)}
header b{color:#fff}.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:#fff;line-height:1.15}.brand svg{width:2.6rem;height:2.6rem;flex:none}.brand small{display:block;font-weight:400;font-size:.78rem;color:#e6c96d}
header button.ghost,header a.btn.ghost{color:#fff;border-color:#fff}
h2{color:var(--brand)}.card{box-shadow:0 1px 3px rgba(20,60,35,.1)}
th{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.tabs button[aria-selected=true]{border-bottom:3px solid var(--accent)}
button:hover,a.btn:hover{filter:brightness(1.12)}
#auth,#f-login{max-width:30rem;margin:2rem auto}
.logo-img{height:3.4rem;width:auto;background:#fff;border-radius:.6rem;padding:.2rem .5rem;flex:none}
[hidden]{display:none!important}
</style>
</head>

  <div id="p-dash"></div><div id="p-members" hidden></div><div id="p-pay" hidden></div><div id="p-watch" hidden></div><div id="p-cases" hidden></div><div id="p-exp" hidden></div><div id="p-ann" hidden></div><div id="p-rep" hidden></div><div id="p-prof" hidden></div><div id="p-set" hidden></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'KSh '+Number(n||0).toLocaleString('en-KE');
const fdate=d=>d?new Date(d.slice(0,10)+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const today=()=>new Date().toISOString().slice(0,10);
const KIND={monthly:'Monthly',registration:'Registration',special:'Special'};
const db=supabase.createClient(KAWUOR_CONFIG.url,KAWUOR_CONFIG.anonKey);
let uid=null,members=[],started=false,editPay=null;

function say(t,bad){const m=$('msg');m.textContent=t||'';m.className=t?(bad?'bad':'ok'):'';m.hidden=!t}
function friendly(e){if(e&&e.code==='23503')return 'This case has contributions recorded, so it cannot be deleted. Close it instead.';if(e&&e.code==='23505')return 'That transaction code has already been recorded.';return (e&&e.message)||'Something went wrong. Please try again.'}
async function run(fn){try{say('');await fn()}catch(e){say(friendly(e),true)}}
async function rpc(name,args){const{data,error}=await db.rpc(name,args);if(error)throw error;return data}
function tag(s){return `<span class="tag t-${esc(s)}">${esc(s)}</span>`}

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));
  for(const t of ['dash','members','pay','watch','cases','exp','ann','rep','prof','set'])$('p-'+t).hidden=t!==b.dataset.tab});
$('f-login').onsubmit=e=>{e.preventDefault();run(async()=>{const{error}=await db.auth.signInWithPassword({email:$('l-email').value.trim(),password:$('l-pass').value});if(error)throw error})};
$('logout').onclick=()=>db.auth.signOut();
db.auth.onAuthStateChange((ev,s)=>{
  if(s&&s.user){if(s.user.id!==uid){uid=s.user.id;setTimeout(start,0)}}
  else{uid=null;started=false;$('app').hidden=true;$('logout').hidden=true;$('f-login').hidden=false}});

async function start(){await run(async()=>{
  const r=await db.from('user_roles').select('role').eq('user_id',uid).maybeSingle();
  if(r.error)throw r.error;
  if(!r.data||r.data.role!=='admin'){$('f-login').hidden=true;$('app').hidden=true;$('logout').hidden=false;say('This page is for administrators only. Your account is not an administrator.',true);return}
  $('f-login').hidden=true;$('app').hidden=false;$('logout').hidden=false;started=true;
  await refresh()})}
async function refresh(){await membersTab();await Promise.all([dash(),payTab(),watch(),casesTab(),expTab(),annTab(),repTab(),setTab()])}

async function dash(){
  const d=await rpc('admin_dashboard');
  const S=(l,v,g)=>`<div class="stat${g?' link':''}"${g?` data-g="${g}" role="button" tabindex="0"`:''}><small>${l}${g?' ›':''}</small><b>${v}</b></div>`;
  $('p-dash').innerHTML=`<div class="card"><h2>Members</h2><div class="stats">${S('Registered people',d.members_total,'m:')}${S('Active memberships',d.active,'m:active')}${S('Deregistered',d.deregistered,'m:deregistered')}${S('Re-registered (active)',d.re_registered,'m:re')}</div></div>
  <div class="card"><h2>Money</h2><div class="stats">${S('Monthly contributions',money(d.monthly_total),'r:income')}${S('Registration fees',money(d.registration_total),'r:registration')}${S('Special contributions',money(d.special_total),'r:special')}${S('Outstanding',money(d.outstanding),'r:arrears')}${S('Paid in advance',money(d.advance),'r:advance')}${S('Total expenses',money(d.expenses_total),'r:expenses')}</div></div>
  <div class="card"><h2>Cases and approvals</h2><div class="stats">${S('Open welfare cases',d.cases_open,'c:open')}${S('Closed welfare cases',d.cases_closed,'c:closed')}${S('Payments waiting for approval',d.pending_payments,'p:')}</div></div>
  <div class="card"><h2>Recent transactions</h2><div class="scroll"><table><thead><tr><th>Date</th><th>From</th><th>For</th><th>Amount</th><th>Code</th><th>Status</th></tr></thead><tbody>
  ${d.recent_payments.map(p=>`<tr><td>${fdate(p.paid_on)}</td><td>${esc(p.who)}</td><td>${KIND[p.kind]}</td><td>${money(p.amount)}</td><td>${esc(p.reference)}</td><td>${tag(p.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No transactions yet.</td></tr>'}</tbody></table></div></div>`;
  document.querySelectorAll('[data-g]').forEach(b=>{const go=()=>jump(b.dataset.g);b.onclick=go;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}

async function membersTab(){
  const{data,error}=await db.from('v_admin_members').select('*').order('full_name');if(error)throw error;members=data;
  $('p-members').innerHTML=`<div class="card"><h2>Members</h2><div class="grid2">
   <div><label for="q">Search name, phone or number</label><input id="q"></div>
   <div><label for="sf">Show</label><select id="sf"><option value="">Everyone</option><option value="active">Active</option><option value="deregistered">Deregistered</option><option value="re">Re-registered</option><option value="none">Awaiting membership</option><option value="arrears">In arrears</option><option value="advance">Paid in advance</option></select></div></div>
   <div class="scroll" style="margin-top:1rem"><table><thead><tr><th>Name</th><th>Phone</th><th>Number</th><th>Status</th><th>Joined</th><th>Outstanding</th><th>Advance</th><th></th></tr></thead><tbody id="mrows"></tbody></table></div></div>`;
  $('q').oninput=$('sf').onchange=drawMembers;drawMembers()}
function drawMembers(){
  const q=$('q').value.toLowerCase(),f=$('sf').value;
  $('mrows').innerHTML=members.filter(m=>{
    if(q&&!`${m.full_name} ${m.phone||''} ${m.number||''}`.toLowerCase().includes(q))return false;
    if(f==='re')return m.category==='re_registered'&&m.status==='active';if(f==='active')return m.status==='active';if(f==='deregistered')return m.status==='deregistered';
    if(f==='none')return !m.membership_id;if(f==='arrears')return Number(m.outstanding)>0;if(f==='advance')return Number(m.advance_paid)>0;return true})
   .map(m=>`<tr><td><a href="#" data-prof="${esc(m.member_id)}">${esc(m.full_name)}</a><br><span class="muted">${esc(m.email)}</span></td><td>${esc(m.phone)}</td><td>${esc(m.number||'')}</td><td>${m.status?tag(m.status):'<span class="muted">Awaiting</span>'}</td><td>${fdate(m.joined_on)}</td><td>${m.membership_id?money(m.outstanding):''}</td><td>${m.membership_id?money(m.advance_paid):''}</td>
   <td>${m.status==='active'?`<button class="sm danger" data-dereg="${esc(m.membership_id)}" data-n="${esc(m.full_name)}">Deregister</button>`:(m.status==='deregistered'&&m.reinstate_until&&m.reinstate_until>=today())?`<button class="sm" data-rein="${esc(m.membership_id)}" data-n="${esc(m.full_name)}">Reinstate</button><br><span class="muted">until ${fdate(m.reinstate_until)}</span>`:`<button class="sm" data-reg="${esc(m.member_id)}" data-re="${m.membership_id?1:''}" data-n="${esc(m.full_name)}">${m.membership_id?'Re-register':'Register'}</button>`}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No members match.</td></tr>';
  document.querySelectorAll('[data-reg]').forEach(b=>b.onclick=()=>run(async()=>{
    const d=prompt(`Joining date for ${b.dataset.n} (YYYY-MM-DD). It can be a past date.`,today());if(!d)return;
    if(b.dataset.re){
      const[st,rt]=await Promise.all([db.from('org_settings').select('key,value').in('key',['reregistration_fee','reregistration_upfront_months']),db.from('contribution_rates').select('amount').eq('rate_type','monthly').lte('effective_from',d).order('effective_from',{ascending:false}).limit(1)]);
      const o=Object.fromEntries((st.data||[]).map(x=>[x.key,+x.value])),need=(o.reregistration_fee||0)+(o.reregistration_upfront_months||0)*Number(rt.data?.[0]?.amount||0);
      const amt=prompt(`Re-registering ${b.dataset.n} needs the fee of ${money(o.reregistration_fee)} plus ${o.reregistration_upfront_months} months paid upfront. Minimum total: ${money(need)}.\n\nEnter the total amount actually received (KSh):`,need);if(!amt)return;
      const code=prompt('Transaction code for this payment:');if(!code)return;
      const meth=prompt('Payment method (M-Pesa, Bank or Cash):','M-Pesa');if(!meth)return;
      const rr=await rpc('reregister_member',{p_member_id:b.dataset.reg,p_joined_on:d,p_amount_received:+amt,p_method:meth,p_reference:code.trim(),p_paid_on:today()});
      say(`${b.dataset.n} re-registered as ${rr.number}. The fee and upfront months are recorded.`);await refresh();return}
    const r=await rpc('register_membership',{p_member_id:b.dataset.reg,p_joined_on:d});say(`${b.dataset.n} registered as ${r.number}.`);await refresh()}));
  document.querySelectorAll('[data-dereg]').forEach(b=>b.onclick=()=>run(async()=>{
    const why=prompt(`Reason for deregistering ${b.dataset.n}:`);if(!why)return;
    await rpc('deregister_membership',{p_membership_id:b.dataset.dereg,p_reason:why,p_date:today()});say('Membership deregistered.');await refresh()}));
  document.querySelectorAll('[data-rein]').forEach(b=>b.onclick=()=>run(async()=>{
    const q=await rpc('reinstatement_quote',{p_membership_id:b.dataset.rein});
    const amt=prompt(`${b.dataset.n} can keep their old membership by clearing everything owed up to now: ${money(q)}.\n\nEnter the total amount actually received (KSh):`,q);if(!amt)return;
    const code=prompt('Transaction code for this payment:');if(!code)return;
    const meth=prompt('Payment method (M-Pesa, Bank or Cash):','M-Pesa');if(!meth)return;
    const r=await rpc('reinstate_membership',{p_membership_id:b.dataset.rein,p_amount_received:+amt,p_method:meth,p_reference:code.trim(),p_paid_on:today()});
    say(`${b.dataset.n} reinstated on ${r.number}.`);await refresh()}));
  document.querySelectorAll('[data-prof]').forEach(a=>a.onclick=e=>{e.preventDefault();run(()=>profile(a.dataset.prof))})}

async function payTab(){
  const{data,error}=await db.from('v_admin_payments').select('*').order('created_at',{ascending:false}).limit(300);if(error)throw error;
  const pend=data.filter(p=>p.status==='pending');const cs=(await db.from('v_case_progress').select('id,title,beneficiary_name').eq('status','open')).data||[];
  const row=(p,acts)=>`<tr><td>${fdate(p.paid_on)}</td><td>${esc(p.who)}</td><td>${esc(p.number||'')}</td><td>${KIND[p.kind]}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.reference)}</td><td>${tag(p.status)}${p.review_note?`<br><span class="muted">${esc(p.review_note)}</span>`:''}</td><td>${acts}</td></tr>`;
  const head='<thead><tr><th>Date</th><th>From</th><th>No.</th><th>For</th><th>Amount</th><th>Method</th><th>Code</th><th>Status</th><th></th></tr></thead>';
  $('p-pay').innerHTML=`${editPay?`<div class="card" id="fixcard"><h2>Correct a payment</h2><p class="muted">${esc(editPay.who)} · ${KIND[editPay.kind]} · ${editPay.status==='approved'?'This payment is approved. Correcting it reverses the old record and enters a new approved one. Both stay in the history.':'This payment is still waiting for approval, so it is changed in place.'}</p><form id="f-fix"><div class="grid2"><div><label for="xa">Amount (KSh)</label><input id="xa" type="number" min="1" step="1" value="${esc(editPay.amount)}" required></div><div><label for="xd">Date paid</label><input id="xd" type="date" value="${esc(editPay.paid_on)}" required></div><div><label for="xm">Method</label><input id="xm" value="${esc(editPay.method)}"></div><div><label for="xr">Transaction code</label><input id="xr" value="${esc(editPay.reference)}" required></div></div><label for="xn">Reason for correction</label><input id="xn" required><button type="submit">Save correction</button> <button type="button" id="xc" class="ghost">Cancel</button></form></div>`:''}<div class="card"><h2>Record a payment</h2><p class="muted">Use this for a payment you have already checked. It is approved and allocated straight away.</p>
   <form id="f-rec"><div class="grid2"><div><label for="rm">From</label><select id="rm"><option value="">Non-member (voluntary)</option>${members.map(m=>`<option value="${esc(m.member_id)}">${esc(m.full_name)}${m.number?' ('+esc(m.number)+')':''}</option>`).join('')}</select></div>
   <div id="nmw"><label for="nm">Non-member name</label><input id="nm"></div>
   <div><label for="rk">For</label><select id="rk"><option value="monthly">Monthly contribution</option><option value="registration">Registration fee</option><option value="special">Special / welfare contribution</option></select></div>
   <div><label for="ra">Amount (KSh)</label><input id="ra" type="number" min="1" step="1" required></div>
   <div><label for="rd">Date paid</label><input id="rd" type="date" value="${today()}" required></div>
   <div><label for="rmth">Method</label><select id="rmth"><option>M-Pesa</option><option>Bank</option><option>Cash</option></select></div>
   <div><label for="rr">Transaction code</label><input id="rr" required></div><div id="rcw" hidden><label for="rc">Welfare case (optional)</label><select id="rc"><option value="">General contribution</option>${cs.map(c=>`<option value="${esc(c.id)}">${esc(c.title)} (${esc(c.beneficiary_name)})</option>`).join('')}</select></div></div><button type="submit">Record payment</button></form></div>
   <div class="card"><h2>Waiting for approval (${pend.length})</h2><div class="scroll"><table>${head}<tbody>${pend.map(p=>row(p,`<button class="sm" data-ap="${p.id}">Approve</button> <button class="sm danger" data-rj="${p.id}">Reject</button> <button class="sm ghost" data-pe="${p.id}">Edit</button>`)).join('')||'<tr><td colspan="9" class="muted">Nothing waiting.</td></tr>'}</tbody></table></div></div>
   <div class="card"><h2>Latest payments</h2><div class="scroll"><table>${head}<tbody>${data.filter(p=>p.status!=='pending').slice(0,100).map(p=>row(p,p.status==='approved'?`<button class="sm ghost" data-pe="${p.id}">Edit</button> <button class="sm danger" data-rv="${p.id}">Reverse</button>`:'')).join('')}</tbody></table></div></div>`;
  const sync=()=>{const nm=!$('rm').value;$('nmw').hidden=!nm;$('nm').required=nm;if(nm)$('rk').value='special';$('rk').disabled=nm;$('rcw').hidden=(nm?'special':$('rk').value)!=='special'};$('rm').onchange=$('rk').onchange=sync;sync();
  $('f-rec').onsubmit=e=>{e.preventDefault();run(async()=>{const nm=!$('rm').value;
    await rpc('record_payment',{p_member_id:$('rm').value||null,p_kind:nm?'special':$('rk').value,p_amount:+$('ra').value,p_paid_on:$('rd').value,p_method:$('rmth').value,p_reference:$('rr').value.trim(),p_contributor_name:nm?$('nm').value.trim():null,p_case_id:(nm||$('rk').value==='special')&&$('rc').value?$('rc').value:null});
    say('Payment recorded and allocated.');await refresh()})};
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>run(async()=>{await rpc('approve_payment',{p_id:b.dataset.ap});say('Payment approved and allocated.');await refresh()}));
  document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>run(async()=>{const r=prompt('Reason for rejecting this payment:');if(!r)return;await rpc('reject_payment',{p_id:b.dataset.rj,p_reason:r});say('Payment rejected.');await refresh()}));
  document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>run(async()=>{const r=prompt('Reason for reversing this approved payment (it will no longer count):');if(!r)return;await rpc('reverse_payment',{p_id:b.dataset.rv,p_reason:r});say('Payment reversed.');await refresh()}))
  document.querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>{editPay=data.find(p=>p.id===b.dataset.pe);payTab().then(()=>scrollTo(0,0))});
  if($('f-fix')){$('xc').onclick=()=>{editPay=null;payTab()};
    $('f-fix').onsubmit=e=>{e.preventDefault();run(async()=>{await rpc('correct_payment',{p_id:editPay.id,p_amount:+$('xa').value,p_paid_on:$('xd').value,p_method:$('xm').value.trim(),p_reference:$('xr').value.trim(),p_reason:$('xn').value.trim()});say('Payment corrected.');editPay=null;await refresh()})}}}

async function watch(){
  const{data,error}=await db.from('v_default_watch').select('*').neq('risk','ok').order('consecutive_unpaid',{ascending:false});if(error)throw error;
  $('p-watch').innerHTML=`<div class="card"><h2>Members approaching or at the default limit</h2>
   <p class="muted">Counts completed months with no payment at all. Update the months first so the list is current. The check also runs by itself each month if you set up the schedule.</p>
   <button id="gen" class="ghost">Update months</button> <button id="chk" class="danger">Run default check now</button>
   <div class="scroll" style="margin-top:1rem"><table><thead><tr><th>Number</th><th>Name</th><th>Months unpaid in a row</th><th>Risk</th></tr></thead><tbody>
   ${data.map(w=>`<tr><td>${esc(w.number)}</td><td>${esc(w.full_name)}</td><td>${w.consecutive_unpaid}</td><td>${tag(w.risk)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No one is close to the limit.</td></tr>'}</tbody></table></div></div>`;
  $('gen').onclick=()=>run(async()=>{await rpc('admin_generate_dues');say('Months updated.');await watch()});
  $('chk').onclick=()=>run(async()=>{if(!confirm('This will deregister every member at or over the limit. Continue?'))return;const n=await rpc('admin_run_default_check');say(`Check complete. ${n} member(s) deregistered.`);await refresh()})}

const CT={bereavement:'Bereavement',medical:'Medical',education:'Education',emergency:'Emergency',other:'Other'};
const CATS=['Bereavement support','Medical assistance','Education support','Meetings','Administration','Other'];
let editCase=null,editExp=null,editAnn=null,expF={from:'',to:'',cat:''},caseF='';

async function casesTab(){
  const{data,error}=await db.from('v_case_progress').select('*').order('status').order('case_date',{ascending:false});if(error)throw error;
  const x=editCase||{},list=caseF?data.filter(c=>c.status===caseF):data;
  $('p-cases').innerHTML=`<div class="card"><h2>${x.id?'Edit welfare case':'New welfare case'}</h2><form id="f-case"><div class="grid2">
   <div><label for="ct">Case type</label><select id="ct">${Object.entries(CT).map(([k,v])=>`<option value="${k}"${x.case_type===k?' selected':''}>${v}</option>`).join('')}</select></div>
   <div><label for="cb">Beneficiary name</label><input id="cb" value="${esc(x.beneficiary_name)}" required></div>
   <div><label for="cti">Title</label><input id="cti" value="${esc(x.title)}" required></div>
   <div><label for="cd">Case date</label><input id="cd" type="date" value="${esc(x.case_date||today())}" required></div>
   <div><label for="cg">Target amount (KSh, optional)</label><input id="cg" type="number" min="1" step="1" value="${esc(x.target_amount||'')}"></div></div>
   <label for="cdt">Details and reason for the appeal</label><textarea id="cdt" rows="3">${esc(x.details)}</textarea>
   <button type="submit">${x.id?'Save changes':'Create case'}</button>${x.id?' <button type="button" id="cx" class="ghost">Cancel</button>':''}</form></div>
   <div class="card"><h2>All welfare cases</h2><div class="grid2"><div><label for="cf">Show</label><select id="cf"><option value="">All cases</option><option value="open"${caseF==='open'?' selected':''}>Open</option><option value="closed"${caseF==='closed'?' selected':''}>Closed</option></select></div></div><p class="muted">To record a contribution to a case, use the Payments tab and choose the case.</p><div class="scroll"><table><thead><tr><th>Case</th><th>Type</th><th>Date</th><th>Target</th><th>Collected</th><th>Remaining</th><th>Status</th><th></th></tr></thead><tbody>
   ${list.map(c=>`<tr><td>${esc(c.title)}<br><span class="muted">${esc(c.beneficiary_name)}</span></td><td>${CT[c.case_type]}</td><td>${fdate(c.case_date)}</td><td>${c.target_amount?money(c.target_amount):'None'}</td><td>${money(c.collected)}${c.percent!=null?` (${c.percent}%)`:''}</td><td>${c.remaining!=null?money(c.remaining):''}</td><td>${tag(c.status)}</td>
   <td><button class="sm ghost" data-ce="${c.id}">Edit</button> <button class="sm ghost" data-cv="${c.id}">Contributions</button> <button class="sm" data-cs="${c.id}" data-st="${c.status}">${c.status==='open'?'Close':'Reopen'}</button> <button class="sm danger" data-cdel="${c.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">No cases yet.</td></tr>'}</tbody></table></div></div><div id="cc"></div>`;
  $('f-case').onsubmit=e=>{e.preventDefault();run(async()=>{
    const row={case_type:$('ct').value,beneficiary_name:$('cb').value.trim(),title:$('cti').value.trim(),details:$('cdt').value.trim(),case_date:$('cd').value,target_amount:$('cg').value?+$('cg').value:null};
    const r=x.id?await db.from('welfare_cases').update(row).eq('id',x.id):await db.from('welfare_cases').insert(row);if(r.error)throw r.error;
    say(x.id?'Case updated.':'Case created. Active members can now see it.');editCase=null;await refresh()})};
  if($('cx'))$('cx').onclick=()=>{editCase=null;casesTab()};
  $('cf').onchange=()=>{caseF=$('cf').value;casesTab()};
  document.querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>{editCase=data.find(c=>c.id===b.dataset.ce);casesTab().then(()=>scrollTo(0,0))});
  document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>run(async()=>{const st=b.dataset.st==='open'?'closed':'open';
    const r=await db.from('welfare_cases').update({status:st}).eq('id',b.dataset.cs);if(r.error)throw r.error;say(st==='closed'?'Case closed.':'Case reopened.');await refresh()}));
  document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>run(async()=>{if(!confirm('Delete this case permanently?'))return;
    const r=await db.from('welfare_cases').delete().eq('id',b.dataset.cdel);if(r.error)throw r.error;say('Case deleted.');await refresh()}));
  document.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>run(async()=>{
    const r=await db.from('v_admin_payments').select('*').eq('case_id',b.dataset.cv).eq('status','approved').order('paid_on',{ascending:false});if(r.error)throw r.error;

   <div class="card"><h2>${esc(m.full_name)}</h2><div class="stats">${S('Current membership',esc(cur?.number||'None yet'))}${S('Status',cur?tag(cur.status):'Awaiting')}${S('Total approved payments',money(paid))}${S('Outstanding',money(yrs.reduce((a,o)=>a+o.c,0)))}${S('Paid in advance',money(yrs.reduce((a,o)=>a+o.d,0)))}</div>
   <form id="f-prof" style="margin-top:1rem"><div class="grid2"><div><label for="pn">Full name</label><input id="pn" value="${esc(m.full_name)}" required></div><div><label for="pp">Phone</label><input id="pp" value="${esc(m.phone)}"></div><div><label>Login email (not changed here)</label><input value="${esc(m.email)}" disabled></div></div><button type="submit">Save details</button></form></div>
   <div class="card"><h2>Membership periods</h2><div class="scroll"><table><thead><tr><th>Number</th><th>Type</th><th>Joined</th><th>Status</th><th>Ended</th><th>Reason</th><th>Reinstate by</th></tr></thead><tbody>${ms.data.map(x=>`<tr><td>${esc(x.number)}</td><td>${x.category==='original'?'Original':'Re-registered'}</td><td>${fdate(x.joined_on)}</td><td>${tag(x.status)}</td><td>${fdate(x.deregistered_on)}</td><td style="white-space:normal">${esc(x.deregistration_reason)}</td><td>${fdate(x.reinstate_until)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Not registered yet.</td></tr>'}</tbody></table></div></div>
   <div class="card"><h2>Contributions by year</h2><div class="scroll"><table><thead><tr><th>Year</th><th>Membership</th><th>Expected to date</th><th>Paid</th><th>Outstanding</th><th>Paid in advance</th></tr></thead><tbody>${yrs.map(o=>`<tr><td>${o.y}</td><td>${esc(o.n)}</td><td>${money(o.a)}</td><td>${money(o.b)}</td><td>${money(o.c)}</td><td>${money(o.d)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No contribution months yet.</td></tr>'}</tbody></table></div></div>
   <div class="card"><h2>All payments</h2><div class="scroll"><table><thead><tr><th>Date</th><th>For</th><th>Welfare case</th><th>Membership</th><th>Amount</th><th>Method</th><th>Code</th><th>Status</th></tr></thead><tbody>${pm.data.map(p=>`<tr><td>${fdate(p.paid_on)}</td><td>${KIND[p.kind]}</td><td>${esc(cm[p.case_id]||'')}</td><td>${esc(p.number||'')}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.reference)}</td><td>${tag(p.status)}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No payments yet.</td></tr>'}</tbody></table></div></div>
   <div class="card"><h2>History of changes</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Membership</th><th>Event</th><th>Note</th></tr></thead><tbody>${ev.map(x=>`<tr><td>${fdate(x.created_at)}</td><td>${esc(num[x.membership_id])}</td><td>${esc(x.event)}</td><td style="white-space:normal">${esc(x.note)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Nothing recorded.</td></tr>'}</tbody></table></div></div>`;
  document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected','false'));
  for(const t of ['dash','members','pay','watch','cases','exp','ann','rep','set'])$('p-'+t).hidden=true;
  $('p-prof').hidden=false;scrollTo(0,0);
  $('pb').onclick=()=>goTab('members');
  $('f-prof').onsubmit=e=>{e.preventDefault();run(async()=>{const w=await db.from('members').update({full_name:$('pn').value.trim(),phone:$('pp').value.trim()}).eq('id',id);if(w.error)throw w.error;say('Details saved.');await membersTab();await profile(id)})}}

const RT={monthly:'Monthly contribution',registration:'Registration fee',bereavement_parent_or_elder:'Bereavement: elderly member or parent',bereavement_child:'Bereavement: member’s child'};
const SK=[['organisation_name','Organisation name','text'],['contact_phone','Phone number','text'],['contact_email','Email address','email'],['default_after_missed_months','Consecutive unpaid months before deregistration','number'],['reregistration_fee','Re-registration fee (KSh)','number'],['reregistration_upfront_months','Months paid upfront when re-registering','number']];
async function setTab(){
  const[r,st,lg]=await Promise.all([db.from('contribution_rates').select('*').order('rate_type').order('effective_from',{ascending:false}),db.from('org_settings').select('*'),db.from('settings_log').select('*').order('changed_at',{ascending:false}).limit(50)]);
  for(const q of[r,st,lg])if(q.error)throw q.error;
  const sv=Object.fromEntries(st.data.map(x=>[x.key,x.value])),seen=new Set(),keys=SK.filter(k=>k[0] in sv);
  $('p-set').innerHTML=`<div class="card"><h2>Contribution amounts</h2>
   <p class="muted">Each amount applies from a date, so old amounts stay on record. For example, the registration fee can be KSh 100 until 31 December 2025 and KSh 500 from 1 January 2026. A new monthly amount applies only to months created after its start date. Payments already recorded and months already created are never rewritten.</p>
   <div class="scroll"><table><thead><tr><th>Type</th><th>Amount</th><th>Applies from</th><th></th></tr></thead><tbody>${r.data.map(x=>{const cur=!seen.has(x.rate_type)&&x.effective_from<=today();if(cur)seen.add(x.rate_type);return`<tr><td>${esc(RT[x.rate_type]||x.rate_type)}</td><td>${money(x.amount)}</td><td>${x.effective_from==='2000-01-01'?'The beginning':fdate(x.effective_from)}</td><td>${cur?tag('active').replace('active','current'):''}</td></tr>`}).join('')}</tbody></table></div>
   <h3>Add or correct an amount</h3><form id="f-rate"><div class="grid2"><div><label for="sr-t">Contribution</label><select id="sr-t">${Object.entries(RT).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select></div>
   <div><label for="sr-a">Amount (KSh)</label><input id="sr-a" type="number" min="0" step="1" required></div>
   <div><label for="sr-d">Applies from</label><input id="sr-d" type="date" value="${today()}" required></div></div>
   <p class="muted">Using a date that already has an amount replaces that amount, and the change is logged.</p><button type="submit">Save amount</button></form></div>
   <div class="card"><h2>Organisation and rules</h2><form id="f-set"><div class="grid2">${keys.map(k=>`<div><label for="st-${k[0]}">${esc(k[1])}</label><input id="st-${k[0]}" type="${k[2]}" value="${esc(sv[k[0]])}" required></div>`).join('')}</div><button type="submit">Save settings</button></form></div>
   <div class="card"><h2>Change log</h2><div class="scroll"><table><thead><tr><th>Date</th><th>What</th><th>Was</th><th>Now</th></tr></thead><tbody>${lg.data.map(x=>`<tr><td>${fdate(x.changed_at)}</td><td style="white-space:normal">${esc(x.item)}</td><td>${esc(x.old_value)}</td><td>${esc(x.new_value)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No changes logged yet.</td></tr>'}</tbody></table></div></div>`;
  $('f-rate').onsubmit=e=>{e.preventDefault();run(async()=>{await rpc('admin_set_rate',{p_type:$('sr-t').value,p_amount:+$('sr-a').value,p_from:$('sr-d').value});say('Amount saved.');await setTab()})};
  $('f-set').onsubmit=e=>{e.preventDefault();run(async()=>{const ch=keys.filter(k=>$('st-'+k[0]).value.trim()!==sv[k[0]]);
    for(const k of ch)await rpc('admin_set_setting',{p_key:k[0],p_value:$('st-'+k[0]).value});
    say(ch.length?`Saved ${ch.length} change${ch.length>1?'s':''}.`:'Nothing was changed.');await setTab()})}}

if(!KAWUOR_CONFIG.url||KAWUOR_CONFIG.url.includes('YOUR-PROJECT'))say('Setup needed: add your Supabase URL and key to config.js.',true);
</script>
</body>
</html>
