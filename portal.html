<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Great Kawuor Welfare Group – Member portal</title>
<link rel="manifest" href="manifest-portal.json"><meta name="theme-color" content="#14452b"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kawuor Welfare">
<style>
:root{--bg:#f4f8f5;--surface:#fff;--ink:#12281d;--muted:#4a5d52;--brand:#1b5e3a;--brand-ink:#fff;--accent:#d4a017;--line:#d5e2d9;--ok:#1d7a4d;--warn:#a96a00;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1f16;--surface:#162b1f;--ink:#e9f2ec;--muted:#a3b8aa;--brand:#5fbf86;--brand-ink:#06190f;--line:#2a4535;--ok:#6fd39b;--warn:#d4a017;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:60rem;margin:0 auto;padding:0 1rem}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem}
header b{font-size:1.1rem}
h2{margin:0 0 .8rem;font-size:1.3rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1.2rem;margin:1rem 0}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}
input,select{width:100%;padding:.7rem;border:1px solid var(--line);border-radius:.5rem;background:var(--bg);color:var(--ink);font:inherit}
button,.btn{font:inherit;font-weight:700;padding:.7rem 1.2rem;border-radius:.5rem;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button.link{border:0;background:none;color:var(--brand);padding:.3rem 0;text-decoration:underline}
form button[type=submit]{margin-top:1rem}
#msg{padding:.8rem 1rem;border-radius:.5rem;margin:1rem 0;font-weight:600;border:1px solid var(--line);background:var(--surface)}
#msg.bad{color:var(--bad);border-color:var(--bad)}#msg.ok{color:var(--ok);border-color:var(--ok)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1rem}
.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}
.tabs button[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.stats{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
.stat small{display:block;color:var(--muted)}.stat b{font-size:1.4rem}
.months{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr))}
.m{border:1px solid var(--line);border-radius:.6rem;padding:.5rem;font-size:.9rem}
.m b{display:block}.m span{color:var(--muted);font-size:.8rem}
.st-paid{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.st-covered_in_advance{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 16%,transparent)}
.st-partial{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.st-unpaid{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:.5rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.bar{height:.7rem;background:var(--line);border-radius:1rem;overflow:hidden;margin:.4rem 0}.bar i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--muted)}
header{background:#14452b;color:#fff;border-bottom:4px solid var(--accent)}
header b{color:#fff}.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:#fff;line-height:1.15}.brand svg{width:2.6rem;height:2.6rem;flex:none}.brand small{display:block;font-weight:400;font-size:.78rem;color:#e6c96d}
header button.ghost,header a.btn.ghost{color:#fff;border-color:#fff}
h2{color:var(--brand)}.card{box-shadow:0 1px 3px rgba(20,60,35,.1)}
th{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.tabs button[aria-selected=true]{border-bottom:3px solid var(--accent)}
button:hover,a.btn:hover{filter:brightness(1.12)}
#auth,#f-login{max-width:30rem;margin:2rem auto}
.logo-img{height:3.4rem;width:auto;background:#fff;border-radius:.6rem;padding:.2rem .5rem;flex:none}
.notice{border-radius:1rem;padding:1rem 1.2rem;margin:1rem 0;border:2px solid}.notice.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}.notice.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.yearbar{display:flex;gap:.5rem;align-items:center}.yearbar input{max-width:8rem;text-align:center}.yearbar button{padding:.5rem .9rem}
.st-due{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}.st-not_yet_due{border-style:dashed}
.animal.photo{width:4.8rem;height:4.8rem;object-fit:contain}.officials{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}.off{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:.8rem;padding:.9rem}
.stline{display:flex;gap:.7rem;align-items:center}.animal{width:4.6rem;height:auto;flex:none}.status-active{border-left:5px solid var(--ok);padding-left:.8rem}.status-partial{border-left:5px solid var(--warn);padding-left:.8rem}.status-passive{border-left:5px solid var(--bad);padding-left:.8rem}
.pw{position:relative}.pw input{padding-right:3rem}.pw .eye{position:absolute;right:.3rem;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);padding:0;width:2.5rem;height:2.5rem;display:flex;align-items:center;justify-content:center;cursor:pointer;filter:none}.pw .eye:hover{color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>

<main class="wrap">
<div id="msg" role="status" hidden></div>

<section id="auth" class="card" hidden>
  <form id="f-login"><h2>Member login</h2>
    <label for="l-email">Email or National ID number</label><input id="l-email" autocomplete="username" required>
    <label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <p><button type="button" class="link" data-go="forgot">Forgot password?</button> · <button type="button" class="link" data-go="register">Create an account</button></p>
    <p><button type="button" class="link" id="resend" hidden>Resend my confirmation email</button></p></form>
  <form id="f-register" hidden novalidate><h2>Create an account</h2>
    <p class="muted">All fields are required.</p>
    <label for="r-name">Full names as per National ID</label><input id="r-name" autocomplete="name" required>
    <label for="r-id">National ID number</label><input id="r-id" inputmode="numeric" required>
    <label for="r-phone">Phone number</label><input id="r-phone" type="tel" autocomplete="tel" required>
    <label for="r-email">Email</label><input id="r-email" type="email" autocomplete="email" required>
    <label for="r-pass">Password (at least 8 characters)</label><input id="r-pass" type="password" autocomplete="new-password" required>
    <label for="r-pass2">Confirm password</label><input id="r-pass2" type="password" autocomplete="new-password" required>
    <button type="submit">Register</button>
    <p class="muted">An administrator will confirm your membership and give you your membership number.</p>
    <p><button type="button" class="link" data-go="login">I already have an account</button></p></form>
  <form id="f-forgot" hidden><h2>Reset your password</h2>
    <label for="p-email">Email</label><input id="p-email" type="email" required>
    <button type="submit">Send reset link</button>
    <p><button type="button" class="link" data-go="login">Back to login</button></p></form>
  <form id="f-reset" hidden><h2>Choose a new password</h2>
    <label for="n-pass">New password (at least 8 characters)</label><input id="n-pass" type="password" minlength="8" autocomplete="new-password" required>
    <button type="submit">Save new password</button></form>
</section>

<section id="app" hidden>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button role="tab" data-tab="payments" aria-selected="false">Payments</button>
    <button role="tab" data-tab="cases" aria-selected="false">Welfare cases</button>
    <button role="tab" data-tab="docs" aria-selected="false">Documents</button>
    <button role="tab" data-tab="officials" aria-selected="false">Officials</button>
    <button role="tab" data-tab="account" aria-selected="false">Account</button>
  </div>
  <div id="p-overview"></div>
  <div id="p-payments" hidden></div>
  <div id="p-cases" hidden></div>
  <div id="p-docs" hidden></div>
  <div id="p-officials" hidden></div>
  <div id="p-account" hidden></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'KSh '+Number(n||0).toLocaleString('en-KE');
const fdate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LABEL={paid:'Paid',partial:'Part paid',unpaid:'Overdue',due:'Due this month',covered_in_advance:'Paid in advance',not_yet_due:'Not yet due',none:'Not a member'};
const db=supabase.createClient(KAWUOR_CONFIG.url,KAWUOR_CONFIG.anonKey,{auth:{storageKey:'kawuor-member-session'}});
let me=null,ms=null,allMs=[],lastEmail='',year=new Date().getFullYear(),uid=null,recovering=false;

function say(t,bad){const m=$('msg');m.textContent=t||'';m.className=t?(bad?'bad':'ok'):'';m.hidden=!t}
function friendly(e){if(e&&e.code==='23505')return 'This payment message or transaction code has already been submitted.';return (e&&e.message)||'Something went wrong. Please try again.'}
async function run(fn){try{say('');await fn()}catch(e){say(friendly(e),true)}}
function showAuth(v){for(const k of ['login','register','forgot','reset'])$('f-'+k).hidden=k!==v;$('auth').hidden=false;$('app').hidden=true;$('logout').hidden=true}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{say('');showAuth(b.dataset.go)});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));
  for(const t of ['overview','payments','cases','docs','officials','account'])$('p-'+t).hidden=t!==b.dataset.tab});

$('f-login').onsubmit=e=>{e.preventDefault();run(async()=>{
  let who=$('l-email').value.trim();if(!who)throw new Error('Enter your email or your National ID number.');
  if(!who.includes('@')){const r=await db.rpc('login_email_for_id',{p_id:who});if(r.error)throw r.error;if(!r.data)throw new Error('We could not find an account for that ID number. Check the number, or log in with your email.');who=r.data}
  lastEmail=who;const{error}=await db.auth.signInWithPassword({email:who,password:$('l-pass').value});
  const nc=!!(error&&/not confirmed/i.test(error.message));$('resend').hidden=!nc;
  if(nc)throw new Error('Your email is not confirmed yet. Open the confirmation email we sent you and tap its link, or tap "Resend my confirmation email" below. If the link has expired, resend it and use the newest email.');
  if(error)throw error})};
$('resend').onclick=()=>run(async()=>{const{error}=await db.auth.resend({type:'signup',email:lastEmail,options:{emailRedirectTo:location.origin+'/portal.html'}});if(error)throw error;say('A new confirmation email has been sent. Open the newest one and tap its link, then log in.')});
$('f-register').onsubmit=e=>{e.preventDefault();run(async()=>{
  const nm=$('r-name').value.trim().replace(/\s+/g,' '),idv=$('r-id').value.trim(),ph=$('r-phone').value.trim(),em=$('r-email').value.trim(),p1=$('r-pass').value,p2=$('r-pass2').value;
  const miss=[];if(!nm)miss.push('full names as per your ID');if(!idv)miss.push('National ID number');if(!ph)miss.push('phone number');if(!em)miss.push('email address');if(!p1)miss.push('password');if(!p2)miss.push('confirm password');
  if(miss.length)throw new Error('Please fill in: '+miss.join(', ')+'.');
  if(nm.split(' ').length<2)throw new Error('Enter your full names as they appear on your ID (at least two names).');
  if(ph.replace(/\D/g,'').length<9)throw new Error('Enter a valid phone number.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))throw new Error('Enter a valid email address.');
  if(p1.length<8)throw new Error('Your password must have at least 8 characters.');
  if(p1!==p2)throw new Error('The two passwords do not match.');
  const nid=idv.replace(/[^A-Za-z0-9]/g,'');if(nid.length<5)throw new Error('Enter a valid National ID number.');
  const used=await db.rpc('id_in_use',{p_id:nid});if(used.error)throw used.error;if(used.data)throw new Error('That National ID number is already registered. If you are already a member, please contact the group.');
  const{data,error}=await db.auth.signUp({email:$('r-email').value.trim(),password:$('r-pass').value,options:{data:{full_name:nm,phone:ph,national_id:nid,self_registration:'1'},emailRedirectTo:location.origin+'/portal.html'}});
  if(error)throw error;
  if(!data.session){say('Account created. Check your email to confirm it, then log in.');showAuth('login')}})};
$('f-forgot').onsubmit=e=>{e.preventDefault();run(async()=>{
  const{error}=await db.auth.resetPasswordForEmail($('p-email').value.trim(),{redirectTo:location.origin+location.pathname});
  if(error)throw error;say('If that email has an account, a reset link is on its way.')})};
$('f-reset').onsubmit=e=>{e.preventDefault();run(async()=>{
  const{error}=await db.auth.updateUser({password:$('n-pass').value});if(error)throw error;
  recovering=false;say('Password updated.');await start()})};
$('logout').onclick=()=>db.auth.signOut();

db.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY'){recovering=true;showAuth('reset');return}
  if(recovering)return;
  if(session&&session.user){if(session.user.id!==uid)setTimeout(start,0)}
  else{uid=null;showAuth(location.hash==='#register'?'register':'login')}});

async function start(){await run(async()=>{
  const{data:{user}}=await db.auth.getUser();if(!user){showAuth('login');return}
  uid=user.id;
  const ro=await db.from('user_roles').select('role').eq('user_id',uid).maybeSingle();
  if(ro.data){$('auth').hidden=true;$('app').hidden=true;$('logout').hidden=false;say('This is an administrator account, not a member account. Please use the administrator page (admin.html).',true);return}
  const r=await db.from('members').select('*').eq('user_id',uid).single();if(r.error)throw r.error;me=r.data;
  if(me.removed_at){$('auth').hidden=true;$('app').hidden=true;$('logout').hidden=false;say('This account has been closed. Please contact the group.',true);return}
  const l=await db.from('memberships').select('*').eq('member_id',me.id).order('created_at',{ascending:false});if(l.error)throw l.error;
  allMs=l.data;ms=l.data.find(x=>x.status==='active')||l.data[0]||null;
  $('auth').hidden=true;$('app').hidden=false;$('logout').hidden=false;
  await Promise.all([overview(),payments(),cases(),docs(),officials(),account()])})}

async function overview(){
  let h=`<div class="card"><h2>Hello, ${esc(me.full_name)}</h2>`;
  if(!ms){$('p-overview').innerHTML=h+`<p>National ID: <b>${esc(me.national_id||'not added yet')}</b></p><p>Your registration is waiting for an administrator to confirm your membership. Your membership number and contribution months will appear here once that is done.</p></div>`+await notices();return}
  const [bal,mon,reg]=await Promise.all([
    db.from('v_membership_balances').select('*').eq('membership_id',ms.id).maybeSingle(),
    db.from('v_month_status').select('*').in('membership_id',allMs.map(x=>x.id)).order('period'),
    db.from('payments').select('amount').eq('membership_id',ms.id).eq('kind','registration').eq('status','approved')]);
  const rate=await db.from('contribution_rates').select('amount').eq('rate_type','registration').lte('effective_from',ms.joined_on).order('effective_from',{ascending:false}).limit(1);

  h+=`<div class="stats">
   <div class="stat"><small>National ID</small><b>${esc(me.national_id||'Not added yet')}</b></div>
   <div class="stat"><small>Membership number</small><b>${esc(ms.number)}</b></div>
   @@STATUS@@
   <div class="stat"><small>Joined</small><b>${fdate(ms.joined_on)}</b></div>
   <div class="stat"><small>Registration fee</small><b>${regPaid>=regDue?'Paid':'Not yet paid'}</b></div>
   <div class="stat"><small>Outstanding</small><b>${money(bal.data?.outstanding)}</b></div>
   <div class="stat"><small>Paid in advance</small><b>${money(bal.data?.advance_paid)}</b></div></div>`;
  let reFee=0,reMo=0,reRate=0;
  if(ms.status!=='active'){
    const[st,rt]=await Promise.all([db.from('org_settings').select('key,value').in('key',['reregistration_fee','reregistration_upfront_months']),db.from('contribution_rates').select('amount').eq('rate_type','monthly').order('effective_from',{ascending:false}).limit(1)]);
    const o=Object.fromEntries((st.data||[]).map(x=>[x.key,+x.value]));reFee=o.reregistration_fee||0;reMo=o.reregistration_upfront_months||0;reRate=Number(rt.data?.[0]?.amount||0)}
  const cur=new Date().toISOString().slice(0,7)+'-01',rates=mr.data||[],rateFor=p=>Number((rates.find(r=>r.effective_from<=p)||rates[rates.length-1]||{}).amount||0);
  const ranges=allMs.map(x=>({a:x.joined_on.slice(0,7)+'-01',b:x.status==='deregistered'&&x.deregistered_on?x.deregistered_on.slice(0,7)+'-01':'9999-12-01'}));
  const nextM=p=>{const d=new Date(p+'T00:00:00');d.setMonth(d.getMonth()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'};
  const msJ=ms.joined_on.slice(0,7)+'-01',endM=ms.status==='deregistered'&&ms.deregistered_on?ms.deregistered_on.slice(0,7)+'-01':null,byP=Object.fromEntries(rows.filter(r=>r.membership_id===ms.id).map(r=>[r.period,r]));
  const ended=[];for(let p=msJ;p<cur&&(!endM||p<=endM);p=nextM(p)){const r=byP[p];ended.push({p,paid:r?+r.paid:0,due:r?+r.due_amount:rateFor(p)})}
  let missed=[];for(let i=ended.length-1;i>=0&&ended[i].paid===0;i--)missed.unshift(ended[i]);
  const short=ended.filter(e=>e.paid<e.due),shortSum=short.reduce((a,e)=>a+Math.max(e.due-e.paid,0),0),nmo=p=>MN[+p.slice(5,7)-1]+' '+p.slice(0,4),
    first=esc((me.full_name||'').trim().split(/\s+/)[0]),plural=n=>n===1?'month':'months',today0=new Date().toISOString().slice(0,10);

  else if(ms.status==='deregistered'){
    notice=`<div class="notice bad"><b>Dear ${first},</b> you have been delisted from being a member of The Great Kawuor Welfare Group. If you wish to proceed with us, please re-register: on the Payments tab choose <b>Re-registration</b> and pay KSh ${(reFee+reMo*reRate).toLocaleString('en-KE')} (the KSh ${reFee.toLocaleString('en-KE')} fee plus ${reMo} months in advance). An administrator will then register you again. Your account and history are kept.${ms.deregistration_reason?`<br><span class="muted">Reason recorded: ${esc(ms.deregistration_reason)}</span>`:''}</div>`}

    animal={active:'Cheetah',partial:'Elephant',passive:'Tortoise'}[lv];

  h+=`</div><div class="card"><h2>Monthly contributions</h2><p class="muted">Choose any year to see every month: paid, part paid, due, overdue, paid in advance or not yet due.</p><div class="yearbar"><button type="button" class="ghost" id="yp" aria-label="Previous year">‹</button><input id="yr" type="number" min="2000" max="2100" step="1" value="${year}" aria-label="Year"><button type="button" class="ghost" id="yn" aria-label="Next year">›</button></div><div class="months" style="margin-top:1rem">`;
  for(let i=0;i<12;i++){const p=`${year}-${String(i+1).padStart(2,'0')}-01`,d=rows.find(r=>r.period===p);
    if(d){h+=`<div class="m st-${d.status}"><b>${MN[i]}</b>${LABEL[d.status]}<br><span>${money(d.paid)} of ${money(d.due_amount)}</span></div>`;continue}
    if(!ranges.some(r=>p>=r.a&&p<=r.b)){h+=`<div class="m"><b>${MN[i]}</b><span>${LABEL.none}</span></div>`;continue}
    const st=p<cur?'unpaid':p===cur?'due':'not_yet_due';
    h+=`<div class="m st-${st}"><b>${MN[i]}</b>${LABEL[st]}<br><span>${money(0)} of ${money(rateFor(p))}</span></div>`}
  $('p-overview').innerHTML=notice+payCard+h+`</div></div>`+await notices();
  const go=y=>{year=Math.min(2100,Math.max(2000,Math.round(+y)||year));overview()};
  $('yr').onchange=e=>go(e.target.value);$('yp').onclick=()=>go(year-1);$('yn').onclick=()=>go(year+1)}
function payLabel(x){const n=x.review_note||'';
  if(x.status==='pending')return 'Waiting for approval';
  if(x.status==='approved')return 'Approved'+(n.startsWith('Corrected:')?' (corrected: '+esc(n.slice(10).trim())+')':'');
  if(x.status==='rejected')return 'Rejected'+(n?': '+esc(n):'');
  if(x.status==='reversed')return n.startsWith('Corrected:')?'Corrected: '+esc(n.slice(10).trim()):'Rejected'+(n?': '+esc(n):'');
  return esc(x.status)}

  const bytes=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
  $('p-docs').innerHTML=error?'<div class="card">Could not load documents.</div>':(data||[]).map(d=>`<div class="card"><h2>${esc(d.title)}</h2><p class="muted">${esc(d.category)} · ${fdate(d.created_at.slice(0,10))} · ${bytes(d.size_bytes)}</p>${d.description?`<p>${esc(d.description)}</p>`:''}<button data-open="${esc(d.file_path)}">Open ${esc(d.file_name)}</button></div>`).join('')||'<div class="card muted">No documents are available to you at the moment. Documents are shared with active members.</div>';
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>run(async()=>{const r=await db.storage.from('documents').createSignedUrl(b.dataset.open,120);if(r.error)throw r.error;window.open(r.data.signedUrl,'_blank','noopener')}))}

async function uploadProof(file){
  if(file.size>5*1048576)throw new Error('The attachment is larger than 5 MB.');
  const path=`${me.id}/${crypto.randomUUID()}-${file.name.replace(/[^A-Za-z0-9._-]/g,'_')}`;
  const up=await db.storage.from('payment-proofs').upload(path,file,{contentType:file.type||'application/octet-stream'});if(up.error)throw up.error;return path}

function parseMsg(t){
  const s=String(t||'');let code=null,m=s.match(/\b([A-Z][A-Z0-9]{9})\b(?=[\s.,:-]*Confirmed)/);
  if(m)code=m[1];
  if(!code){m=s.match(/\b(?=[A-Z0-9]*\d)(?=[A-Z0-9]*[A-Z])([A-Z0-9]{10})\b/);if(m)code=m[1]}
  if(!code){m=s.match(/(?:ref(?:erence)?|transaction|txn|trx|receipt)[\s\w.]{0,12}?[:#=\-]\s*([A-Za-z0-9][A-Za-z0-9\-]{5,24})/i);if(m)code=m[1].toUpperCase()}
  let amount=null;m=s.match(/(?:ksh?s?|kes)\.?\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)/i);
  if(m)amount=Number(m[1].replace(/,/g,''));
  return{code,amount}}

function memberShared(myNumber,caseOpts){
  const yr=new Date().getFullYear();let L=[{n:myNumber,k:'monthly',y:yr,c:'',a:''},{n:'',k:'monthly',y:yr,c:'',a:''}];
  function tot(){const sum=L.reduce((a,l)=>a+(+l.a||0),0),pm=parseMsg($('sh-p').value);$('sh-t').innerHTML=`<b>Lines add up to KSh ${sum.toLocaleString('en-KE')}</b>${pm&&pm.amount?` · your message shows KSh ${pm.amount.toLocaleString('en-KE')} ${pm.amount===sum?'✓':'(these must match)'}`:''}`}
  async function chk(i){const n=(L[i].n||'').trim(),t=$('nm'+i);if(!t)return;if(!n){t.textContent='';return}const r=await db.rpc('lookup_membership_number',{p_number:n});t.textContent=r.error||!r.data?'Not found, or not an active member':'Member: '+r.data}
  function draw(){$('sl').innerHTML=L.map((l,i)=>`<div class="grid2" style="border-top:1px solid var(--line);padding-top:.5rem"><div><label>Membership number</label><input data-f="n" data-i="${i}" placeholder="for example KA012"><span class="muted" id="nm${i}"></span></div><div><label>For</label><select data-f="k" data-i="${i}"><option value="monthly">Monthly contribution</option><option value="registration">Registration fee</option><option value="special">Welfare case or other</option></select></div><div><label>Year (monthly only)</label><input data-f="y" data-i="${i}" type="number" min="2000" max="2100"></div><div><label>Welfare case (optional)</label><select data-f="c" data-i="${i}">${caseOpts}</select></div><div><label>Amount (KSh)</label><input data-f="a" data-i="${i}" type="number" min="1" step="1"></div><div><button type="button" class="ghost" data-rm="${i}">Remove line</button></div></div>`).join('');
    document.querySelectorAll('#sl [data-f]').forEach(el=>{el.value=L[el.dataset.i][el.dataset.f]??'';el.oninput=el.onchange=()=>{L[el.dataset.i][el.dataset.f]=el.value;tot()};if(el.dataset.f==='n')el.onblur=()=>chk(+el.dataset.i)});
    document.querySelectorAll('#sl [data-rm]').forEach(b=>b.onclick=()=>{if(L.length<=2){say('A shared payment needs at least two lines.',true);return}L.splice(+b.dataset.rm,1);draw()});
    L.forEach((l,i)=>{if(l.n)chk(i)});tot()}
  const upd=()=>{const pm=parseMsg($('sh-p').value),ok=!!(pm&&pm.code&&pm.amount),has=!!$('sh-p').value.trim();$('sh-cw').hidden=ok||!has;$('sh-r').textContent=!has?'':ok?`Found: code ${pm.code} and amount KSh ${pm.amount.toLocaleString('en-KE')}.`:'We could not read the code and amount. Please check you pasted the whole message, or type the code below.';tot()};
  $('sh-p').oninput=upd;$('sh-add').onclick=()=>{L.push({n:'',k:'monthly',y:yr,c:'',a:''});draw()};draw();upd();
  $('f-sh').onsubmit=e=>{e.preventDefault();run(async()=>{
    const msg=$('sh-p').value.trim(),pm=parseMsg(msg);if(!msg)throw new Error('Please paste the payment message you received.');
    const code=(pm&&pm.code)||$('sh-c').value.trim();if(!code)throw new Error('We could not find the transaction code. Please type it in the code box.');
    if(L.some(l=>!(l.n||'').trim()||!(+l.a>0)))throw new Error('Enter a membership number and an amount on every line.');
    const r=await db.rpc('submit_shared_payment',{p_method:$('sh-m').value,p_reference:code,p_message_text:msg,p_paid_on:$('sh-d').value,p_lines:L.map(l=>({number:l.n.trim(),kind:l.k,amount:+l.a,year:l.k==='monthly'&&l.y?+l.y:null,case_id:l.k==='special'&&l.c?l.c:null}))});
    if(r.error)throw r.error;
    say('Your shared payment was submitted. The administrator will check it and share it out between the members.');await payments()})}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const old=b.textContent;(navigator.clipboard?navigator.clipboard.writeText(b.dataset.copy):Promise.reject()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent=old,1500)}).catch(()=>{b.textContent='Select and copy';setTimeout(()=>b.textContent=old,2000)})});

const EYE='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  EYEOFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
function addEyes(){document.querySelectorAll('input[type=password]:not([data-eye])').forEach(i=>{i.dataset.eye='1';const w=document.createElement('div');w.className='pw';i.parentNode.insertBefore(w,i);w.appendChild(i);
  const b=document.createElement('button');b.type='button';b.className='eye';b.setAttribute('aria-label','Show password');b.innerHTML=EYE;
  b.onclick=()=>{const show=i.type==='password';i.type=show?'text':'password';b.setAttribute('aria-label',show?'Hide password':'Show password');b.innerHTML=show?EYEOFF:EYE};w.appendChild(b)})}
new MutationObserver(addEyes).observe(document.body,{childList:true,subtree:true});addEyes();

async function officials(){
  const[o,ch,st]=await Promise.all([db.from('officials').select('*').order('slot'),db.from('official_changes').select('*').order('changed_on',{ascending:false}).order('created_at',{ascending:false}),db.from('org_settings').select('key,value').eq('key','officials_term_note')]);
  const list=(o.data||[]).filter(x=>x.full_name),note=(st.data&&st.data[0]&&st.data[0].value)||'';
  const txt=c=>c.kind==='replaced'?`${esc(c.old_name)} was replaced by ${esc(c.new_name)}.`:c.kind==='vacated'?`${esc(c.old_name)} left the position.`:`${esc(c.new_name)}'s term was renewed.`;
  $('p-officials').innerHTML=o.error?'<div class="card">Could not load the officials.</div>':list.length?`<div class="card"><h2>Officials of the group</h2><div class="officials">${list.map(x=>`<div class="off"><small class="muted">${esc(x.position)}</small><br><b>${esc(x.full_name)}</b><br>${x.phone?`<a href="tel:${esc(String(x.phone).replace(/[^0-9+]/g,''))}">${esc(x.phone)}</a>`:''}${x.term_start?`<br><span class="muted">Appointed: ${fdate(x.term_start)}</span>`:''}${x.term_end?`<br><span class="muted">Term ends: ${fdate(x.term_end)} (term ${x.term_no})</span>`:''}</div>`).join('')}</div>${note?`<p class="muted" style="margin-top:1rem">${esc(note)}</p>`:''}</div>${(ch.data||[]).length?`<div class="card"><h2>Changes in leadership</h2>${ch.data.map(c=>`<p><b>${fdate(c.changed_on)}</b> · ${esc(c.position)}: ${txt(c)}${c.reason?`<br><span class="muted">Reason: ${esc(c.reason)}</span>`:''}</p>`).join('')}</div>`:''}`:'<div class="card muted">The list of officials will appear here soon.</div>'}

if(!KAWUOR_CONFIG.url||KAWUOR_CONFIG.url.includes('YOUR-PROJECT'))say('Setup needed: add your Supabase URL and anon key to config.js.',true);
</script>
